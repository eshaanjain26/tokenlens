  <g font-family="Geist, Helvetica, Arial, sans-serif">
    <text x="152" y="117" font-size="34" font-weight="500" fill="#0a0a0a">Token<tspan fill="#6b6b6b" font-weight="400">Lens</tspan></text>
    <text x="72" y="300" font-size="76" font-weight="500" fill="#0a0a0a" letter-spacing="-1.5">What does your prompt</text>
